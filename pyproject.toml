[project]
name = "latest-nos-news"
version = "0.1.0"
description = "macOS menu bar app showing the latest NOS news headline"
requires-python = ">=3.11"
dependencies = [
    "rumps>=0.4.0",
    "feedparser>=6.0",
    "anthropic>=0.25.0",
]

[project.scripts]
latest-nos-news = "latest_nos_news.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
